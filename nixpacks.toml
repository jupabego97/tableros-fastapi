# Forces Python install from backend when the Railway service Root Directory is `.`.
# Prefer Root Directory = `backend` (see README_RAILWAY.md); this file is the fallback.

[phases.install]
cmds = ["pip install -r backend/requirements.txt"]

[start]
cmd = "cd backend && uvicorn app.socket_app:socket_app --host 0.0.0.0 --port ${PORT:-8000}"
